<!DOCTYPE html>
<html>
<head>
    <title>Scholarship Login Page</title>
</head>

<body>

<h2>Scholarship Login Form</h2>

<form>

<fieldset>
<legend>Student Login</legend>

<label>Student Name:</label><br>
<input type="text" name="name" placeholder="Enter your name"><br><br>

<label>Email ID:</label><br>
<input type="email" name="email" placeholder="Enter your email"><br><br>

<label>Password:</label><br>
<input type="password" name="password" placeholder="Enter password"><br><br>

<label>Course:</label><br>
<select>
<option>BCA</option>
<option>BBA</option>
<option>BSC</option>
<option>B.Tech</option>
</select><br><br>

<label>Gender:</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female<br><br>

<label>Required Documents:</label><br>
<input type="checkbox"> Aadhaar Card<br>
<input type="checkbox"> Marksheet<br>
<input type="checkbox"> Income Certificate<br><br>

<input type="submit" value="Login">
<input type="reset" value="Clear">

</fieldset>

</form>

</body>
</html>
